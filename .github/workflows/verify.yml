# Copyright 2026 Carlos Ulisses Flores (Codex Hash Ltda.)
#
# Verify the package on every push and pull request.
#
# GitHub Actions workflow with five jobs. The verify job (Python 3.12 and 3.13) installs the
# requirements, checks the committed provenance seal, runs pytest, replicates the results with
# run_all.py, checks every article number with verify_paper_numbers.py and runs the publication
# audits. The lint job runs ruff and interrogate on the infrastructure code. The lint-pesquisa job
# is informational (continue-on-error) and only lists ruff findings in the research scripts. The
# reuse job checks licence and copyright coverage against REUSE.toml. The attest job runs only on
# a push to main after the other jobs pass, and publishes a signed SLSA build-provenance
# attestation (Sigstore) for the three seal files; check it with
# `gh attestation verify manifest/SHA256SUMS.txt -R ulissesflores/lgbt-indicador-violencia`.
# Every action is pinned to a full commit SHA (version in the comment) and the token is read-only
# except where a job needs more.
#
# Inputs
# ------
# - requirements.txt (installed with pip, plus pytest)
# - make_provenance.py, run_all.py, verify_paper_numbers.py, pyproject.toml
# - scripts/inventario_publico.py, scripts/auditar_publicacao.py, tests/
# - tests/test_auditar_publicacao.py and scripts/ (checked by interrogate)
# - REUSE.toml and LICENSES/ (checked by reuse lint)
#
# Outputs
# -------
# - pass or fail status of each job in the GitHub Actions log
# - on push to main: a build-provenance attestation for output/hash-chain.md,
#   output/provenance.json and manifest/SHA256SUMS.txt, stored by GitHub
# - no files are written to the repository
#
# Usage
# -----
# Run by GitHub Actions on push and pull request.
#
# Status
# ------
# No registration status is claimed for this file.
#
# Author
# ------
# Carlos Ulisses Flores (Codex Hash Research Laboratory),
# ORCID https://orcid.org/0000-0002-6034-7765.
# Repository: https://github.com/ulissesflores/lgbt-indicador-violencia

name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 (piso de requires-python) e 3.13. O selo e a evidência foram feitos em 3.14 (requirements.lock); 3.11 fica fora:
        # requires-python >= 3.12 e um script de pesquisa (discurso/governos/scripts/tabela_md.py) usa f-string que só compila a partir da 3.12.
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt pytest
      # 1. integridade: o selo commitado confere com os arquivos (verification-first)
      - run: python -I make_provenance.py --verify
      # 2. testes que travam os números publicados, só sobre os derivados distribuídos (sem microdado bruto, sem rede)
      - run: pytest -q
      # 3. recálculo na réplica (Trilha 1) + testes + selo, o mesmo comando do README; falha se algum arquivo divergir
      - run: python -I run_all.py
      # 3b. todo número que o artigo imprime: hashes de script e saída + valor no arquivo commitado
      # (o run_all acima já recalculou a réplica e comparou com os commitados, sem rodá-la de novo)
      - run: python -I verify_paper_numbers.py
      # 4. auditoria de publicação: inventário e literatura têm de passar (código 0)
      - run: python -I scripts/inventario_publico.py --check
      - run: python -I scripts/auditar_publicacao.py --check inventario
      - run: python -I scripts/auditar_publicacao.py --check literatura
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # nível estrito (bloqueia): código de infraestrutura, configurado em pyproject.toml (line-length 100, docstring numpy)
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: check
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: format --check
      - run: pipx run interrogate run_all.py make_provenance.py verify_paper_numbers.py scripts/ tests/test_auditar_publicacao.py
  lint-pesquisa:
    runs-on: ubuntu-latest
    # informativo: scripts de pesquisa; reformatá-los mudaria arquivos cobertos pelo selo sem mudar lógica
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          # --exit-zero: lista os achados no log sem pintar o job de vermelho (o job é informativo, ver acima)
          args: check --isolated --exit-zero --select E,F,W,B --ignore E401,E701,E702,E741,E501,E731,E402 --line-length 130 .
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # licença e copyright de todo arquivo (REUSE.toml transcreve o NOTICE)
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
  attest:
    # atestação SLSA do selo, assinada pelo Sigstore com a identidade deste workflow; só na main e
    # só depois de verify, lint e reuse verdes (atestar um selo que não confere seria pior que nada)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, lint, reuse]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            output/hash-chain.md
            output/provenance.json
            manifest/SHA256SUMS.txt
