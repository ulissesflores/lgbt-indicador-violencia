   </g>
   <g id="text_12">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5b5a55" x="313.701569" y="132.55495" transform="rotate(-0 313.701569 132.55495)">18 em que a matéria não é a do caso</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #5b5a55" transform="translate(313.701569 173.774286)">14 sem morte violenta confirmada</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #5b5a55" transform="translate(313.701569 182.732536)">(indeterminada ou não violenta)</text>
   </g>
   <g id="text_14">
