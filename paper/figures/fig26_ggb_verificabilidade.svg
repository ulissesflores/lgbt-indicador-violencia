  <g id="text_33">
   <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; fill: #1f1f1e" transform="translate(8.64 17.758125)">Dos 160 casos sorteados da lista do GGB de 2019, 50 (31,3%) puderam</text>
   <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; fill: #1f1f1e" transform="translate(8.64 31.291594)">ser verificados nos critérios do paper; LGBTfobia aparece como</text>
   <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; fill: #1f1f1e" transform="translate(8.64 44.273062)">motivo em só 3 das 73 mortes violentas</text>
  </g>
  <g id="text_34">
   <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #5b5a55" transform="translate(8.64 62.838625)">Lista de casos do relatório de 2019 do GGB, amostra aleatória de 160: em cada etapa, quantos casos</text>
   <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #5b5a55" transform="translate(8.64 72.6927)">continuam a poder ser conferidos</text>
  </g>
  <g id="text_35">
   <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f1f1e" x="18" y="618.153118" transform="rotate(-0 18 618.153118)">Como ler</text>
  </g>
  <g id="text_36">
   <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #1f1f1e" transform="translate(18 630.41718)">Em (a), cada barra é quantos casos passaram por uma etapa de conferência; a que sobra à direita explica o</text>
   <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #1f1f1e" transform="translate(18 639.861812)">que saiu: casos sem matéria recuperada ou fora do critério são casos que não deu para verificar, nunca</text>
   <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #1f1f1e" transform="translate(18 649.306444)">casos considerados falsos. A largura é proporcional ao número de casos. Em (b), entre as mortes violentas</text>
   <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #1f1f1e" transform="translate(18 658.751076)">confirmadas, o que a própria fonte (matéria, polícia, família) diz ser o motivo; o motivo vem da fonte,</text>
   <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #1f1f1e" transform="translate(18 668.195708)">não do codificador. Nenhum caso é identificado: só contagens.</text>
  </g>
  <g id="text_37">
   <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f1f1e" x="18" y="687.273118" transform="rotate(-0 18 687.273118)">Termos</text>
  </g>
  <g id="text_38">
   <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #5b5a55" transform="translate(18 699.53718)">verificável = a matéria foi recuperada, é do caso, confirma morte violenta e identifica a vítima como</text>
   <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #5b5a55" transform="translate(18 708.594772)">LGBT+ de forma expressa · amostra de 160 de 329 casos da lista nominal de 2019 · motivo desconhecido = a</text>
   <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #5b5a55" transform="translate(18 718.039404)">fonte não informa motivo · “não dá para verificar” não é o mesmo que “falso”: o paper não usa essa</text>
   <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #5b5a55" transform="translate(18 727.484036)">palavra · GGB = Grupo Gay da Bahia · latrocínio = roubo seguido de morte</text>
  </g>
