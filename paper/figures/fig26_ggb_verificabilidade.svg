   </g>
   <g id="text_6">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1f1f1e" transform="translate(9.932634 151.005055)">em que a matéria é</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1f1f1e" transform="translate(9.932634 159.963305)">do caso</text>
   </g>
   <g id="text_7">
