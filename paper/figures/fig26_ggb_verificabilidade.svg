    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1f1f1e" transform="translate(9.932634 247.041103)">expressamente que a</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #1f1f1e" transform="translate(9.932634 255.999353)">vítima é LGBT+</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #5b5a55" transform="translate(313.701569 77.354238)">54 sem matéria recuperada: 31 link morto,</text>
