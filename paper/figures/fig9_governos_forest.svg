  <g id="text_26">
   <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; fill: #1f1f1e" transform="translate(8.64 18.238125)">O painel de governadores só enxergaria efeitos maiores que 10,1% a</text>
   <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; fill: #1f1f1e" transform="translate(8.64 31.313344)">20,4% na taxa de homicídios; abaixo disso, não diz nada</text>
  </g>
  <g id="text_27">
   <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #5b5a55" transform="translate(8.64 48.078625)">Faixa de variação da taxa registrada de morte por agressão compatível com os dados, por grupo, numa</text>
   <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #5b5a55" transform="translate(8.64 57.9327)">troca de PT por DEM ou PL</text>
  </g>
  <g id="text_28">
   <text style="font-weight: 700; font-size: 8.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f1f1e" x="18" y="344.462656" transform="rotate(-0 18 344.462656)">Como ler</text>
  </g>
  <g id="text_29">
   <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #1f1f1e" transform="translate(18 356.726719)">A barra roxa clara é o que os dados ainda permitem: do que seria uma queda ao que seria uma alta. O cinza</text>
   <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #1f1f1e" transform="translate(18 366.171351)">é o que o painel exclui. Como a barra sempre inclui zero, o resultado é “não sei se houve efeito”, e não</text>
   <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; fill: #1f1f1e" transform="translate(18 375.393737)">“não houve efeito”: efeitos pequenos passam despercebidos.</text>
  </g>
  <g id="text_30">
